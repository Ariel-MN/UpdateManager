[GitHub]
username = Ariel-MN

[UpdateManager]
# Window title shown when the app opens.
title = Update Manager
# Heading shown at the top inside the window.
heading = Application Library
# UI scale: "auto"/blank = automatic DPI scaling; a number (1.5, 2.0) enlarges on HiDPI/4K.
ui_scale = auto
# Check for a new release of Update Manager itself on startup and ask to update.
check_on_startup = true

[App1]
name = AutoClicker
version = v1.0.1
url = https://github.com/Ariel-MN/AutoClicker/releases/latest
# Single icon in the app's repo -> used in both themes (downloaded automatically).
icon_light = autoclicker.png
icon_dark =

